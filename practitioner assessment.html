<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Loréa – Practitioner Assessment</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap">
<style>
:root{--bg:#faf6ef;--card:#fffdf9;--ink:#2e2a27;--mute:#7a7068;--gold:#9c7a3c;--line:#e3d9c8;--err:#a63d2f;--ro:#f3ede2;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1b18;--card:#2a2521;--ink:#f1e9dc;--mute:#b3a898;--gold:#d2ae6d;--line:#4a4239;--err:#ef8a7a;--ro:#332d28}}
:root[data-theme="dark"]{--bg:#1f1b18;--card:#2a2521;--ink:#f1e9dc;--mute:#b3a898;--gold:#d2ae6d;--line:#4a4239;--err:#ef8a7a;--ro:#332d28}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Jost,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:28px 18px 56px}
header{text-align:center;padding:12px 0 18px}
.logo{display:block;margin:0 auto 10px;width:170px;max-width:60%;height:auto}
.mark{font:600 44px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.04em;color:var(--gold);margin:0}
.sub{font:500 13px/1.4 Jost,sans-serif;color:var(--mute);letter-spacing:.14em;margin:6px 0 0}
h1{font:600 26px/1.2 "Cormorant Garamond",Georgia,serif;margin:18px 0 4px}
header p{margin:0;color:var(--mute)}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 18px;margin:16px 0}
section.ro{background:var(--ro)}
h2{font:600 22px/1.2 "Cormorant Garamond",Georgia,serif;margin:0 0 14px;color:var(--gold)}
.f{margin:0 0 16px}
.f>label,.f>.q{display:block;font-weight:500;margin-bottom:6px}
.req::after{content:" *";color:var(--err)}
input[type=text],input[type=password],input[type=date],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px}
textarea{min-height:84px;resize:vertical}
input:focus-visible,textarea:focus-visible,.opt:focus-within{outline:2px solid var(--gold);outline-offset:1px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--bg);cursor:pointer;min-height:44px}
.opt input{accent-color:var(--gold);width:18px;height:18px;margin:0}
.grid .opt{flex:1 1 calc(50% - 8px)}
.err{color:var(--err);font-size:14px;margin-top:4px;display:none}
.bad .err{display:block}.bad input[type=text],.bad input[type=date],.bad textarea{border-color:var(--err)}
.note{color:var(--mute);font-size:15px;margin:0 0 10px}
button{font:500 17px Jost,sans-serif;background:var(--gold);color:#fff;border:0;border-radius:10px;padding:14px 20px;width:100%;cursor:pointer;min-height:48px}
:root[data-theme="dark"] button{color:#1f1b18}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button{color:#1f1b18}}
button:disabled{opacity:.6}
.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold);width:auto;padding:8px 14px;min-height:40px;font-size:15px}
.row{display:grid;grid-template-columns:38% 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border-bottom:0}
.row b{font-weight:500;color:var(--mute)}
.row span{white-space:pre-wrap;word-break:break-word}
.done{text-align:center;padding:40px 10px}
.hide{display:none}
</style>
</head>
<body>
<main>
<header>
  <img class="logo" src="logo12.png" alt="Loréa Esthétique Atelier logo">
  <p class="mark">Loréa</p>
  <p class="sub">ESTHÉTIQUE ATELIER · BEAUTY, BLESSED, REFINED</p>
  <h1>Practitioner assessment</h1>
  <p>For Loréa practitioners only.</p>
</header>

<section id="gate">
  <div class="f"><label for="pin" class="req">Staff PIN</label><input id="pin" type="password" autocomplete="off"></div>
  <div class="f"><label for="cid" class="req">Client ID (for example LEA-0003)</label><input id="cid" type="text" autocomplete="off" autocapitalize="characters"></div>
  <button id="load" type="button">Load client</button>
  <p id="gerr" class="err" style="text-align:center;margin-top:12px"></p>
</section>

<div id="client" class="hide"></div>
<form id="form" class="hide" novalidate></form>
<div id="done" class="done hide">
  <h2>Assessment saved</h2>
  <p>The assessment PDF will appear in the Client List shortly.</p>
  <p id="doneNote" class="note"></p>
  <p><button type="button" onclick="location.reload()">Assess another client</button></p>
</div>
</main>
<script>
// Paste the Web app URL from Google Apps Script here
var ENDPOINT="PASTE_YOUR_WEB_APP_URL_HERE";
var today=new Date().toISOString().slice(0,10),PIN="",CID="";
var ERR={badpin:"That PIN isn’t correct.",notfound:"We couldn’t find that Client ID.",locked:"Too many wrong PINs. Please wait 5 minutes and try again.",pinnotset:"The staff PIN hasn’t been set in the script yet."};
var S=[
 {t:"Practitioner",f:[
  {k:"assessor",l:"Practitioner",y:"text",r:1},
  {k:"assessDate",l:"Date of assessment",y:"date",v:today,r:1}]},
 {t:"Professional assessment",f:[
  {k:"skinType",l:"Skin type",y:"radio",o:["Normal","Dry","Oily","Combination"],r:1},
  {k:"skinCondition",l:"Skin condition",y:"check",o:["Dehydrated","Sensitive","Congested","Acne-prone","Pigmented","Compromised barrier","Mature"],g:1},
  {k:"skinConditionOther",l:"Other condition",y:"text"},
  {k:"assessmentNotes",l:"Assessment notes",y:"area"}]},
 {t:"Recommended treatment plan",f:[
  {k:"primaryTreatment",l:"Primary treatment recommendation",y:"area",r:1},
  {k:"treatmentFrequency",l:"Recommended treatment frequency",y:"text"},
  {k:"homecare",l:"Homecare recommendation",y:"area"},
  {k:"productsRecommended",l:"Products recommended",y:"area"},
  {k:"expectedGoals",l:"Expected skin goals",y:"area"}]},
 {t:"Practitioner sign-off",f:[
  {k:"practitionerSignature",l:"Type your full name as your signature",y:"text",r:1}]}
];
function $(i){return document.getElementById(i)}
function el(t,a,h){var e=document.createElement(t);for(var k in a)e.setAttribute(k,a[k]);if(h!=null)e.textContent=h;return e}
function show(n,t){n.textContent=t;n.style.display="block"}
async function post(o){var r=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(o)});return r.json()}

var form=$("form"),all=[];
S.forEach(function(s){
  var sec=el("section");sec.appendChild(el("h2",{},s.t));
  s.f.forEach(function(f){
    all.push(f);var w=el("div",{class:"f","data-k":f.k}),id="i_"+f.k;
    if(f.y==="check"||f.y==="radio"){
      w.appendChild(el("div",{class:"q"+(f.r?" req":"")},f.l));
      var box=el("div",{class:"opts"+(f.g?" grid":"")});
      f.o.forEach(function(v){var o=el("label",{class:"opt"}),c=el("input",{type:f.y==="check"?"checkbox":"radio",name:f.k,value:v});o.appendChild(c);o.appendChild(el("span",{},v));box.appendChild(o)});
      w.appendChild(box);
    }else{
      w.appendChild(el("label",{for:id,class:f.r?"req":""},f.l));
      if(f.y==="area")w.appendChild(el("textarea",{id:id,name:f.k,rows:3}));
      else{var i=el("input",{type:f.y,id:id,name:f.k,autocomplete:"off"});if(f.v)i.value=f.v;w.appendChild(i)}
    }
    w.appendChild(el("div",{class:"err"},"Please complete this field."));
    sec.appendChild(w);
  });
  form.appendChild(sec);
});
var btn=el("button",{type:"submit"},"Save assessment");form.appendChild(btn);
var msg=el("p",{class:"err",style:"text-align:center;margin-top:12px"});form.appendChild(msg);
function val(f){
  if(f.y==="check")return Array.prototype.map.call(form.querySelectorAll('[name="'+f.k+'"]:checked'),function(x){return x.value});
  if(f.y==="radio"){var c=form.querySelector('[name="'+f.k+'"]:checked');return c?c.value:""}
  return form.querySelector('[name="'+f.k+'"]').value.trim();
}

function render(j){
  var box=$("client");box.innerHTML="";
  var top=el("section",{class:"ro"});
  top.appendChild(el("h2",{},"Client "+j.id));
  top.appendChild(el("p",{class:"note"},"Read only. This is what the client entered."));
  var again=el("button",{type:"button",class:"ghost"},"Load a different client");again.onclick=function(){location.reload()};
  top.appendChild(again);box.appendChild(top);
  j.sections.forEach(function(s){
    var sec=el("section",{class:"ro"});sec.appendChild(el("h2",{},s.title));
    s.rows.forEach(function(r){var row=el("div",{class:"row"});row.appendChild(el("b",{},r[0]));row.appendChild(el("span",{},r[1]));sec.appendChild(row)});
    box.appendChild(sec);
  });
  $("gate").classList.add("hide");box.classList.remove("hide");form.classList.remove("hide");window.scrollTo(0,0);
}

async function load(){
  var pin=$("pin").value.trim(),id=$("cid").value.trim().toUpperCase(),g=$("gerr"),b=$("load");
  g.style.display="none";
  if(!pin||!id){show(g,"Enter the PIN and the Client ID.");return}
  if(ENDPOINT.indexOf("PASTE")===0){show(g,"This page isn’t connected yet. Add the Web app URL.");return}
  b.disabled=true;b.textContent="Loading…";
  try{
    var j=await post({type:"lookup",pin:pin,clientId:id});
    if(j.ok){PIN=pin;CID=j.id;render(j)}else show(g,ERR[j.error]||"Something went wrong.");
  }catch(x){show(g,"Couldn’t reach the server. Check your connection and the Web app URL.")}
  b.disabled=false;b.textContent="Load client";
}
$("load").onclick=load;
["pin","cid"].forEach(function(i){$(i).addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();load()}})});

form.addEventListener("submit",async function(e){
  e.preventDefault();var ok=true,first=null,data={};
  all.forEach(function(f){
    var v=val(f);data[f.k]=v;var w=form.querySelector('[data-k="'+f.k+'"]');
    var bad=f.r&&(!v||!v.length);
    w.classList.toggle("bad",!!bad);if(bad){ok=false;first=first||w}
  });
  if(!ok){first.scrollIntoView({behavior:"smooth",block:"center"});return}
  data.type="assessment";data.pin=PIN;data.clientId=CID;
  btn.disabled=true;btn.textContent="Saving…";msg.style.display="none";
  var note="";
  try{
    var j=await post(data);
    if(!j.ok){btn.disabled=false;btn.textContent="Save assessment";show(msg,ERR[j.error]||"Something went wrong. Please try again.");return}
  }catch(x){note="Sent, but no confirmation could be read. Please check that the assessment PDF link has appeared in the Client List."}
  $("doneNote").textContent=note;
  $("client").classList.add("hide");form.classList.add("hide");$("done").classList.remove("hide");window.scrollTo(0,0);
});
</script>
</body>
</html>
